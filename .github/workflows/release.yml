# Builds and publishes a GitHub release when a v* tag is pushed (make release).
# The release assets are what consoles download for automatic updates.
#
# Actions are pinned to commit SHAs (tags can be moved). Only the publish job,
# which runs no build tooling, can write to the repository.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tag matches VERSION
        run: |
          v="v$(cat VERSION)"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($v)"
            exit 1
          fi

      # go-version-file honors go.mod's toolchain line, so releases are built
      # with the patched Go release pinned there, not the go directive's minimum.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # Fail the release on any vulnerability the code actually reaches
      # (stdlib or dependencies), for both the Linux console and Windows agent.
      - name: Check toolchain and vulnerabilities
        run: |
          want="$(awk '/^toolchain /{print $2}' go.mod)"
          got="$(go env GOVERSION)"
          if [ "$got" != "$want" ]; then
            echo "::error::building with $got, go.mod pins $want"
            exit 1
          fi
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          GOOS=windows "$(go env GOPATH)/bin/govulncheck" ./...

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: make test

      - name: Build release assets
        run: make dist BUMP=0  # release.sh already bumped VERSION for this release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: bin/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # release.sh checks whether the tag is on alpha (pre-release)
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: bin/dist/

      # With a release signing key configured (internal/update/release.pub),
      # this creates a draft: scripts/release.sh --sign signs SHA256SUMS with
      # the key, which never leaves the maintainer's machine, and publishes it.
      - name: Publish
        run: scripts/release.sh --publish
        env:
          GH_TOKEN: ${{ github.token }}
