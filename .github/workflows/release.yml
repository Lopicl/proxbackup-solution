# Builds and publishes a GitHub release when a v* tag is pushed (make release).
# The release assets are what consoles download for automatic updates.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release.sh checks whether the tag is on alpha (pre-release)

      - name: Tag matches VERSION
        run: |
          v="v$(cat VERSION)"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($v)"
            exit 1
          fi

      # go-version-file honors go.mod's toolchain line, so releases are built
      # with the patched Go release pinned there, not the go directive's minimum.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fail the release on any vulnerability the code actually reaches
      # (stdlib or dependencies), for both the Linux console and Windows agent.
      - name: Check toolchain and vulnerabilities
        run: |
          want="$(awk '/^toolchain /{print $2}' go.mod)"
          got="$(go env GOVERSION)"
          if [ "$got" != "$want" ]; then
            echo "::error::building with $got, go.mod pins $want"
            exit 1
          fi
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          GOOS=windows "$(go env GOPATH)/bin/govulncheck" ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: make test

      - name: Build release assets
        run: make dist BUMP=0  # release.sh already bumped VERSION for this release

      - name: Publish
        run: scripts/release.sh --publish
        env:
          GH_TOKEN: ${{ github.token }}
